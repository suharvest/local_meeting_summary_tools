# Meeting Assistant Configuration Example
# Copy this file to config.yaml and fill in your credentials

server:
  host: "0.0.0.0"
  port: 5173  # Single port for both frontend and API
  cors_origins:
    - "*"

database:
  host: "localhost"
  port: 3306
  user: "your_username"
  password: "YOUR_DB_PASSWORD"  # Replace with actual password
  database: "your_database_name"
  pool_size: 5

llm:
  default_provider: "gemini"
  providers:
    gemini:
      api_key: "YOUR_GEMINI_API_KEY"  # Replace with actual API key
      model: "gemini-1.5-flash"
    qwen:
      api_key: "YOUR_QWEN_API_KEY"  # Replace with actual API key
      model: "qwen-plus"
      base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    ollama:
      base_url: "http://localhost:11434"
      model: "llama3.2"

output:
  directory: "./output"
  format: "markdown"
